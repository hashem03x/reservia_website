<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Applies the saved theme (if any) to <html> before first paint, so
      there is no flash of Light Mode before Dark Mode kicks in (or vice
      versa). Defaults to light for any first-time visitor or when
      localStorage is unavailable -- this never reads the OS's
      prefers-color-scheme, by design (see tokens.css).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rsv_theme');
          document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A3D30" />
    <!-- Icons generated from the brand logo emblem (public/favicon.ico, public/icons/). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!-- Visitors without JavaScript see the prerendered page: no boot overlay, no entrance offsets. -->
    <noscript><style>.appLoader{display:none!important}.steps>li{opacity:1!important;transform:none!important}</style></noscript>
    <!--
      Replaced at build time (and by the dev server) with the route's
      static title, description, robots, Open Graph, canonical/hreflang
      and Organization JSON-LD -- see the reservia-static-seo plugin in
      vite.config.ts. The app swaps these for live tags on boot.
    -->
    <!--static-head-->

    <!--
      Typefaces: Bebas Neue for headings/display text (requested), with
      Readex Pro as the fallback for anything Bebas Neue doesn't cover
      (it's Latin-only, so Arabic headings fall through to Readex Pro
      automatically). IBM Plex Sans Arabic remains the body/Arabic
      typeface and IBM Plex Mono the rate board/calculator figures --
      both ported from the reference template, unchanged.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking first paint (the prerendered page shows in the
      fallback system fonts, then swaps -- display=swap, as before). The
      noscript copy keeps the fonts for visitors without JavaScript.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      />
    </noscript>
    <!-- Avoids a white flash before the stylesheet/React mount -- matches the app loader's background. -->
    <style>html,body{background:#0a3d30;margin:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
